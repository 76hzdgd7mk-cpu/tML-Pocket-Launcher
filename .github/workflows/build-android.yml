
name: Build tML Pocket Launcher ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.101

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --install "platform-tools" "platforms;android-37" "ndk;30.0.14904198-rc1" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed"
          }

      - name: Download official tModLoader references
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\tModLoader.zip"
          $target = "$env:RUNNER_TEMP\tModLoader"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          curl.exe --fail --location --retry 3 `
            "https://github.com/tModLoader/tModLoader/releases/download/v2026.09.3.1/tModLoader.zip" `
            --output $archive

          if ($LASTEXITCODE -ne 0) {
            throw "tModLoader download failed"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force

          $marker = Get-ChildItem -Path $target -Filter "tMLMod.targets" -Recurse -File | Select-Object -First 1

          if (-not $marker) {
            throw "Could not locate tMLMod.targets"
          }

          ./scripts/build/prepare-game-references.ps1 -TmlRoot $marker.Directory.FullName

      - name: Build ARM64 APK
        shell: pwsh
        run: |
          ./scripts/checks/verify.ps1 -Android -Assemble

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tML-Pocket-Launcher-ARM64
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
